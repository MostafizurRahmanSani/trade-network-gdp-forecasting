[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gdp-stgnn"
version = "1.0.0"
description = "Spatio-temporal graph neural networks and conformal prediction for multi-country GDP growth forecasting on trade networks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0",
    "torch_geometric>=2.4",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "statsmodels",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]
